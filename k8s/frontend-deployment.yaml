apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: employee-management

spec:
  replicas: 2

  selector:
    matchLabels:
      app: employee-frontend

  template:
    metadata:
      labels:
        app: employee-frontend

    spec:
      containers:
        - name: frontend
          image: dauntlessjaypee/employee-management-frontend:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
